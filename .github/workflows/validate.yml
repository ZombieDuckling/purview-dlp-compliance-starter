name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build sample report
        run: |
          python tools/build_compliance_report.py \
            --inventory data/synthetic-sensitive-inventory.csv \
            --events data/sample-dlp-events.json \
            --output sample-output/dlp-compliance-report.md
      - name: Validate repository files
        run: python tests/validate_project.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
